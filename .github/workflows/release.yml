name: Release

# Builds the universal macOS bundle, signs the updater artifacts, and publishes
# a GitHub Release with the .dmg + the latest.json the in-app updater reads.
# See docs/RELEASING.md. Two entry points:
#   • workflow_call from cut-release.yml — the normal flow, when a release.json
#     version change lands on main. (A tag pushed by GITHUB_TOKEN does NOT
#     re-trigger workflows, so cut-release invokes this directly.)
#   • push of a vX.Y.Z tag — manual escape hatch (tag a commit by hand).
on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag:
        description: "Tag to build (set when invoked by cut-release.yml)."
        required: true
        type: string
      body:
        description: "Release notes body (from release.json notes)."
        required: false
        type: string
        default: ""

# Let tauri-action create the release and upload assets.
permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14 # Apple Silicon runner; builds the universal binary.
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      # pnpm version comes from package.json "packageManager" (pnpm@11.x).
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      # Apple Silicon only — we don't ship Intel. Single arch ≈ half the build
      # time of a universal binary. macos-14 is already an arm64 host.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      # Caches ~/.cargo + src-tauri/target across runs so warm builds skip
      # recompiling tauri and the dependency tree (the bulk of the build time).
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing — REQUIRED for self-update (set via `gh secret set`).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple code-signing + notarization — OPTIONAL. Without these the build
          # still produces an ad-hoc-signed .dmg (Gatekeeper will warn on first
          # open). Set all five to get a notarized, warning-free download +
          # frictionless self-update. See docs/RELEASING.md.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "En Tu Cara ${{ inputs.tag || github.ref_name }}"
          releaseBody: ${{ inputs.body != '' && inputs.body || 'Download the .dmg below. Installed copies self-update automatically.' }}
          releaseDraft: false
          prerelease: false
          args: --target aarch64-apple-darwin
