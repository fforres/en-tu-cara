name: CI

# Runs the test suite on real (non-draft) pull requests only — NOT on draft PRs,
# and NOT on pushes to main (merging is already gated by the PR check). The
# `frontend` and `rust` checks are required by the "Require passing tests"
# ruleset, so a PR can't merge to main until both are green.
# https://github.com/fforres/en-tu-cara/settings/rules
on:
  pull_request:
    # ready_for_review fires when a draft is marked ready, so checks run then.
    types: [opened, synchronize, reopened, ready_for_review]

# Cancel superseded runs on the same PR (saves CI minutes on rapid pushes).
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # pnpm version comes from package.json "packageManager" (pnpm@11.x).
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  rust:
    name: rust
    if: ${{ !github.event.pull_request.draft }}
    # macOS-only app: tray.rs imports tauri-nspanel/objc2 unconditionally and the
    # EventKit/NSPanel modules are cfg(macos), so the crate does NOT compile on
    # Linux — these tests must run on macOS. Kept lean to limit the 10x runner
    # cost: a stub dist satisfies tauri::generate_context!() (no Node/Vite build),
    # --lib skips the binary + doctests, and rust-cache makes warm runs fast.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: mkdir -p dist && printf '<!doctype html><title>en-tu-cara tests</title>' > dist/index.html

      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
