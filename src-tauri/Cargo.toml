[package]
name = "en-tu-cara"
version = "0.3.0"
description = "Unmissable meeting alerts for macOS. Fully local."
authors = ["fforres"]
edition = "2021"

[lib]
name = "en_tu_cara_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"

# Overlay: native NSPanel (screenSaver level + collectionBehavior). Pinned to exact
# rev on the v2.1 branch — branch is not default; unpinned = non-reproducible (PLAN §1).
[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "a3122e894383aa068ec5365a42994e3ac94ba1b6" }
# EventKit safe wrapper. Pinned exact: 5-star single-maintainer crate (PLAN risk register);
# CP1a proves occurrence expansion + RSVP fields or we switch to objc2-event-kit.
eventkit-rs = "=0.5.6"
# Direct dep ONLY for EKEventStore::refreshSourcesIfNecessary (eventkit-rs doesn't
# expose it) — nudges macOS to pull fresh data from Google/iCloud each poll.
objc2-event-kit = { version = "0.3", features = ["EKEventStore"] }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"

# Self-update (desktop only): download + verify (minisign) + swap the .app in
# place; process::relaunch() restarts into the new build. See docs/RELEASING.md.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Native notification on self-update (so a deploy is visibly confirmed).
tauri-plugin-notification = "2"
# File logging into the Skyward data dir (~/.config/skyward/en-tu-cara/logs).
tauri-plugin-log = "2"
